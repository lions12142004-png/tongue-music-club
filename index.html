<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="舌ゲーム">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<title>舌ゲーム</title>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="rotate"><div>スマホを<b>横向き</b>にしてください<small>プレイ中・測定中は一時停止しています</small></div></div>
<!-- カメラ映像（画面には出さず、Canvas に描いて使う。iPhone で止まらないよう非表示にはしない） -->
<video id="cam" playsinline muted autoplay></video>
<form id="idform" autocomplete="off">
  <input id="idinput" type="text" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="12" placeholder="例: A01" enterkeyhint="done">
  <button type="submit">決定</button>
</form>
<form id="nameform" autocomplete="off">
  <input id="nameinput" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="8" placeholder="ユーザー名" enterkeyhint="done">
</form>
<noscript>JavaScript を有効にしてください</noscript>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator && !/[?&]mock/.test(location.search)) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}));
  }
</script>
</body>
</html>
